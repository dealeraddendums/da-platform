name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ec2-18-145-132-52.us-west-1.compute.amazonaws.com >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@ec2-18-145-132-52.us-west-1.compute.amazonaws.com '
            set -e
            export PATH="/usr/bin:/usr/local/bin:$PATH"
            cd /var/www/da-platform
            git fetch origin
            git reset --hard origin/main
            sudo rm -rf node_modules .next
            /usr/bin/npm install
            # Next.js static export occasionally races on the .next/export →
            # .next/server rename step (ENOENT / ENOTEMPTY). The same code
            # builds cleanly on the next attempt. Retry up to 3 times with a
            # short FS settle delay between attempts.
            build_ok=0
            for attempt in 1 2 3; do
              if /usr/bin/npm run build; then
                build_ok=1
                break
              fi
              echo "Build attempt $attempt failed — cleaning .next and retrying"
              sudo rm -rf .next
              sync
              sleep 2
            done
            if [ "$build_ok" != "1" ]; then
              echo "Build failed after 3 attempts" >&2
              exit 1
            fi
            # --update-env so newly-added env vars in .env.production take
            # effect on pm2 restart without a manual reload.
            pm2 restart da-platform --update-env || pm2 start ecosystem.config.js --update-env
            echo "Deploy complete"
          '
