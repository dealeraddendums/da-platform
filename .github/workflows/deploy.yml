name: Deploy to Production

on:
  push:
    branches: [main]

# One deploy at a time. Rapid pushes (or a manual deploy racing the workflow)
# caused npm install / next build to fight for the same node_modules path on
# the EC2, producing SIGBUS / ENOENT mid-build and stripping node_modules/.bin/.
concurrency:
  group: deploy-production
  cancel-in-progress: false

# Runs on the self-hosted runner installed ON the production EC2
# (ec2-18-145-132-52), so the deploy executes locally — no inbound SSH and no
# security-group opening for GitHub-hosted runner IPs. The runner is a systemd
# service (actions.runner.dealeraddendums-da-platform.da-platform-prod).
#
# Delegates to the canonical zero-downtime deploy.sh (separate repo/ checkout →
# build in a fresh releases/<sha>/ → atomic `current` symlink swap → pm2 reload
# → health gate → auto-revert). This is the SAME mechanism used for manual
# deploys and, critically, builds the directory PM2 actually serves from
# (/var/www/da-platform/current).
#
# The previous in-place `git reset --hard` + build in the repo ROOT was broken
# two ways: (1) PM2 serves `current/` (a release dir), NOT the root, so even a
# "successful" in-place build never updated the live app; (2) its 2 GB
# NODE_OPTIONS cap OOM'd `next build`'s type-check phase on this codebase, so
# every deploy failed outright. deploy.sh builds with ample heap (7.6 GB box,
# ~4 GB free) and only cuts over after a verified, healthy build.
jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Deploy via deploy.sh (origin/main)
        run: |
          set -e
          export PATH="/usr/bin:/usr/local/bin:$PATH"
          # Generous heap for next build's type-check (the old 2 GB cap OOM'd),
          # still well under the box's free RAM.
          export NODE_OPTIONS="--max-old-space-size=4096"
          bash /var/www/da-platform/deploy.sh
