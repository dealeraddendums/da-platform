name: Deploy to Production

on:
  push:
    branches: [main]

# One deploy at a time. Rapid pushes (or a manual deploy racing the workflow)
# caused npm install / next build to fight for the same node_modules path on
# the EC2, producing SIGBUS / ENOENT mid-build and stripping node_modules/.bin/.
concurrency:
  group: deploy-production
  cancel-in-progress: false

# Runs on the self-hosted runner installed ON the production EC2
# (ec2-18-145-132-52), so the deploy executes locally — no inbound SSH and no
# security-group opening for GitHub-hosted runner IPs. The runner is a systemd
# service (actions.runner.dealeraddendums-da-platform.da-platform-prod).
jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Deploy
        run: |
          set -e
          export PATH="/usr/bin:/usr/local/bin:$PATH"
          # Cap Node heap so a runaway build cannot OOM the box (PM2 + active
          # users are also resident). 2 GB is comfortable for Next 14 here.
          export NODE_OPTIONS="--max-old-space-size=2048"

          cd /var/www/da-platform
          git fetch origin
          git reset --hard origin/main
          sudo rm -rf node_modules .next
          npm install

          # Next.js occasionally races on the .next/export → .next/server
          # rename (ENOENT / ENOTEMPTY); the same code builds cleanly on retry.
          build_ok=0
          for attempt in 1 2 3; do
            if npm run build; then
              build_ok=1
              break
            fi
            echo "Build attempt $attempt failed — cleaning .next and retrying"
            sudo rm -rf .next
            sync
            sleep 2
          done
          if [ "$build_ok" != "1" ]; then
            echo "Build failed after 3 attempts" >&2
            exit 1
          fi

          # --update-env so newly-added .env.production vars take effect on restart.
          pm2 restart da-platform --update-env || pm2 start ecosystem.config.js --update-env
          echo "Deploy complete"
